<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hinglaj Jalebi Center</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f4f4;
}

nav{
background:#111;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
}

.hero{
height:80vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
text-align:center;
background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
url("https://images.unsplash.com/photo-1599487488170-d11ec9c172f0");
background-size:cover;
}

.btn{
background:#ff9f1c;
padding:10px 20px;
color:white;
text-decoration:none;
border-radius:6px;
}

.section{
padding:60px;
text-align:center;
}

.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

footer{
background:#000;
color:#888;
text-align:center;
padding:20px;
}

</style>
</head>

<body>

<nav>
<h2>Hinglaj Jalebi Center</h2>
</nav>

<section class="hero">
<h1>Authentic Taste of Haryana</h1>
<p>Hot Jalebi • Crispy Samosa • Desi Chai</p>
<a class="btn">View Menu</a>
</section>

<section class="section">
<h2>Our Menu</h2>

<div class="menu">

<div class="card">
<h3>Jalebi</h3>
<p>Fresh hot jalebi with sweet syrup.</p>
</div>

<div class="card">
<h3>Samosa</h3>
<p>Crispy samosa with spicy filling.</p>
</div>

<div class="card">
<h3>Desi Chai</h3>
<p>Strong Indian tea with milk.</p>
</div>

</div>

</section>

<footer>
© Hinglaj Haryana Jalebi Center
</footer>

</body>
</html>
